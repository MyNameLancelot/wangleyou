name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an active deployment finish before starting another one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before deployment
    # workflow_dispatch also allows selecting a branch; only main may publish.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check.yml

  build:
    name: Build Pages artifact
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      SITE_BASE: /wangleyou/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: npm ci
      - run: npm run build
      - name: Upload built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
